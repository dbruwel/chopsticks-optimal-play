[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chopsticks_optimal_play"
version = "0.1.0"
dependencies = ["numpy"]

[project.scripts]
chopsticks = "chopsticks_optimal_play.play:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["jupyterlab", "matplotlib", "networkx"]

[tool.setuptools.packages.find]
where = ["src"]
